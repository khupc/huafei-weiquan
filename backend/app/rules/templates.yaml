# 各节点固定文案与拼接骨架（spec 3.2 - 3.6）。
# review: pending —— 话术为初稿，需产品负责人确认措辞；涉及法条、撤诉红线的部分需法务审校。
# 占位符 {xxx} 由规则引擎用槽位填充，不交给模型自由发挥。
review: pending

node1:
  scaffold:
    - title: 出了什么事
      hint: 比如：莫名其妙扣钱 / 想改低价套餐不给办 / 突然被停机 / 有隐形合约或违约金 / 营销骚扰 / 宽带押金不退 / 网络差
    - title: 时间与金额
      hint: 比如：从今年 8 月开始，每个月扣 30 元
    - title: 找过客服没有
      hint: 比如：打过客服没解决 / 还没联系过 / 已有工单号
  quick_replies:
    none: 还没打过客服电话
    verbal_only: 打过但没解决/无工单
    ticket_logged: 打过且有工单号
  empathy: 遇到这种事确实闹心，我来帮你一步步处理。
  ask:
    core_issue: 能说说具体出了什么事吗？比如哪项费用、什么时候开始、多少钱。
    prior_contact: 这件事你之前打过客服电话吗？
    both: 能说说具体出了什么事吗？之前打过客服电话没有？

node2:
  principles:
    - 必开通话录音
    - 绝不恋战：不纠缠“系统限制”，不吵架
    - 防画饼：不接受没有明确时间的口头承诺
  # 五段式子弹话术：亮明录音 -> 客观事实 -> 注入法条 -> 明确诉求 -> 立场施压
  script:
    - label: 亮明录音
      text: 你好，本次通话我已录音，请先报一下你的工号。
    - label: 客观事实
      text: "{fact_line}"
    - label: 注入法条
      text: 根据{law_refs}的相关规定，运营商应当保障用户的知情权和选择权。
    - label: 明确诉求
      text: 我的诉求是：{demand}。
    - label: 立场施压
      text: 如果今天不能处理，请给我本次工单编号，我将直接向工信部申诉。
  closing:
    - branch: 客服明确拒绝
      text: 请报出你的工号和本次工单编号，我记录为拒绝办理。（记下后直接挂断）
    - branch: 客服口头答应 / 给方案
      text: 请确认你的工号、本次工单编号，以及最晚明天（T+1）给我回复；逾期未回复我将直接申诉。

node3:
  prior_record: "本人已于{call_date}拨打{hotline}向企业投诉，客服工号{agent_id}，工单编号{ticket_id}，问题至今未解决。"
  prior_record_no_ticket: "本人已拨打{hotline}向企业投诉，问题至今未解决。"
  nav_steps:
    - 打开微信，搜索公众号“工信部投诉”
    - 点击底部“我要申诉”，选择“电信用户申诉”
    - 按页面顺序依次粘贴上面 4 项内容
    - 填写本人实名手机号和验证码，提交
  body_max_chars: 280

node4:
  general_red_lines:
    - 退款没实际到账、套餐/业务没在官方渠道生效之前，绝不在工信部平台点“撤诉”或“满意”
    - 不接受话费优惠券、限时消费券、积分、视频会员代替解决
    - 不接受“原套餐加赠临时折扣包”（到期会恢复高价）
  escalate_after_days: 15
  remind_after_days: 3

node5:
  supplement: "补充说明：本人已于{t0_date}通过工信部申诉渠道反映上述问题，截至目前运营商/省公司专员仍未依法解决。"
  channels:
    - 向当地省通信管理局反映（附上工信部申诉记录和上面的补充说明）
    - 拨打 12345 政务服务热线反映
  small_claims_threshold: 1000
  small_claims: 涉及金额超过 1000 元且行政调解无效的，可通过互联网法院在线提起小额诉讼。

guardrails:
  # 申诉正文中剔除的情绪/辱骂词，产品可按内测反馈增补
  emotional_words: [坑爹, 太坑了, 骗子, 垃圾, 无耻, 流氓, 黑心, 气死, 恶心, 坑人]
