<title>劳动仲裁助手</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
/* 布局：手机单栏，最宽 560px 居中；顶部步骤条 + 每页一张主卡片，像一份逐步填好的仲裁材料 */
:root {
  --bg: #f3f5f4; --surface: #ffffff; --ink: #18211f; --muted: #5c6b67; --line: #d8e0dd;
  --accent: #1f5f57; --accent-ink: #ffffff; --accent-soft: #e2efec;
  --solid: #1f5f57; --need: #b7791f; --dispute: #8a8f8d; --danger: #b3412e;
  --need-soft: #fbf1df; --danger-soft: #f8e6e2;
  --serif: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --sans: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121816; --surface: #1b2321; --ink: #e6ecea; --muted: #9aaaa5; --line: #2e3a37;
  --accent: #6cbfb2; --accent-ink: #0c1312; --accent-soft: #1f3330;
  --solid: #6cbfb2; --need: #e0a84f; --dispute: #8d9895; --danger: #e48a78;
  --need-soft: #33291a; --danger-soft: #3a2420; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121816; --surface: #1b2321; --ink: #e6ecea; --muted: #9aaaa5; --line: #2e3a37;
  --accent: #6cbfb2; --accent-ink: #0c1312; --accent-soft: #1f3330;
  --solid: #6cbfb2; --need: #e0a84f; --dispute: #8d9895; --danger: #e48a78;
  --need-soft: #33291a; --danger-soft: #3a2420; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
#app { max-width: 560px; margin: 0 auto; padding-bottom: 96px; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 8px; padding-block: 10px; }
.bar h1 { font-family: var(--serif); font-size: 17px; margin: 0; flex: 1; letter-spacing: .02em; }
.icon-btn { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 4px 10px; font-size: 13px; }
.steps { display: flex; gap: 2px; padding-bottom: 8px; overflow-x: auto; }
.steps button { flex: 1 0 auto; border: 0; background: transparent; padding: 4px 6px; font-size: 12px; color: var(--muted); border-bottom: 2px solid transparent; }
.steps button.on { color: var(--accent); border-color: var(--accent); font-weight: 600; }
.steps button:disabled { opacity: .45; cursor: default; }

main { display: grid; gap: 14px; padding-block: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
h2 { font-family: var(--serif); font-size: 20px; margin: 0 0 4px; text-wrap: balance; }
h3 { font-size: 15px; margin: 0; }
.sub { color: var(--muted); font-size: 13px; margin: 0; }
.eyebrow { font-size: 11px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.stack { display: grid; gap: 10px; }

.btn { border: 0; border-radius: 10px; padding: 10px 16px; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.btn.plain { background: transparent; color: var(--muted); padding: 6px 8px; font-weight: 400; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.block { width: 100%; }
.src { color: var(--muted, #888); font-size: 11px; font-weight: normal; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
.check input { margin-top: 3px; flex: none; }
.ask { border: 1px solid var(--need, #b7791f); }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

textarea, input[type=text], input[type=number], input[type=date], input:not([type]), select {
  width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); }
textarea { min-height: 120px; resize: vertical; }
label.f { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }

.city { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 10px; background: transparent; width: 100%; text-align: left; }
.city b { color: var(--ink); }
.city-list { max-height: 240px; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 6px; padding-top: 8px; }
.disclaimer { font-size: 12px; color: var(--muted); text-align: center; }

/* 对话 */
.chat { display: grid; gap: 10px; }
.msg { max-width: 88%; padding: 10px 12px; border-radius: 12px; white-space: pre-wrap; }
.msg.ai { background: var(--surface); border: 1px solid var(--line); justify-self: start; border-top-left-radius: 4px; }
.msg.user { background: var(--accent); color: var(--accent-ink); justify-self: end; border-top-right-radius: 4px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.composer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 4; }
.composer .inner { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; }
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); }
.thinking { color: var(--muted); font-size: 13px; }

/* 事实表 */
.facts { display: grid; gap: 8px; }
.fact { display: grid; grid-template-columns: 7.5em 1fr; gap: 8px; align-items: center; font-size: 14px; }
.fact span { color: var(--muted); }
.fact .empty { color: var(--need); }

/* 请求卡片 */
.claim { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; background: var(--surface); }
.claim.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.claim header { display: flex; gap: 10px; align-items: flex-start; }
.claim input[type=checkbox] { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); flex: none; }
.tier { font-size: 12px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; border: 1px solid currentColor; }
.tier.solid { color: var(--solid); } .tier.need { color: var(--need); } .tier.dispute { color: var(--dispute); }
.els { display: grid; gap: 4px; font-size: 13px; }
.el { display: flex; justify-content: space-between; gap: 8px; }
.el .ok { color: var(--solid); } .el .need, .el .partial { color: var(--need); } .el .no { color: var(--danger); }
details { font-size: 13px; }
details summary { cursor: pointer; color: var(--accent); }
.law { padding: 6px 0; border-top: 1px dashed var(--line); }
.pending { font-size: 11px; color: var(--need); border: 1px solid var(--need); border-radius: 4px; padding: 0 4px; margin-left: 4px; white-space: nowrap; }
.amount { font-variant-numeric: tabular-nums; font-weight: 700; }
.warn { background: var(--need-soft); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.danger { background: var(--danger-soft); color: var(--danger); border-radius: 10px; padding: 10px 12px; font-size: 13px; }

/* 测算 */
.calc-line { display: grid; gap: 4px; padding: 10px 0; border-top: 1px solid var(--line); }
.calc-line:first-child { border-top: 0; }
.formula { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.params { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.manual { font-size: 11px; color: var(--accent); }

/* 报告 */
.big { font-family: var(--serif); font-size: 34px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.tri { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line); }
.tri i:nth-child(1) { background: var(--solid); } .tri i:nth-child(2) { background: var(--need); } .tri i:nth-child(3) { background: var(--dispute); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.legend b::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; background: currentColor; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; background: transparent; padding: 8px 4px; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button.on { color: var(--accent); border-color: var(--accent); font-weight: 600; }
ol.path { margin: 0; padding-left: 20px; display: grid; gap: 10px; }
ol.path small { color: var(--muted); display: block; }

/* 证据 */
.ev-group { display: grid; gap: 8px; }
.drawer-mask { position: fixed; inset: 0; background: rgb(0 0 0 / .35); z-index: 20; }
.drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(320px, 85vw); background: var(--surface); z-index: 21; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 16px max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; display: grid; align-content: start; gap: 8px; }
.case-item { text-align: left; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: transparent; }
.fab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 15; border-radius: 999px; padding: 10px 16px; box-shadow: 0 4px 14px rgb(0 0 0 / .18); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 78vh; background: var(--surface); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; z-index: 25; display: grid; grid-template-rows: auto 1fr auto; padding: 14px 16px calc(12px + env(safe-area-inset-bottom, 0px)); max-width: 640px; margin: 0 auto; }
.sheet-body { overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-block: 8px; }
.risk { border-left: 3px solid var(--need); padding-left: 10px; }
.risk.high { border-color: var(--danger); }
.tl { display: grid; grid-template-columns: 6.5em 1fr; gap: 4px 10px; font-size: 14px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 30; }
pre.export { white-space: pre-wrap; font-size: 12px; background: var(--bg); padding: 10px; border-radius: 8px; max-height: 260px; overflow: auto; }
.model { font-size: 11px; color: var(--muted); }
.used-by { font-size: 11px; color: var(--muted); margin-top: 6px; }
.route { border-color: var(--need); background: var(--need-soft); }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>

<div id="app">
  <header class="top">
    <div class="wrap">
      <div class="bar">
        <button class="icon-btn" @click="ui.drawer = true" aria-label="历史案件">☰</button>
        <h1>劳动仲裁助手 <span class="pending">测试版</span></h1>
        <button v-if="st.page !== 'P1'" class="icon-btn" @click="go('P1')">补充事实</button>
      </div>
      <nav class="steps" v-if="st.chat.some(m => m.role === 'user')">
        <button v-for="p in PAGES" :key="p.id" :class="{on: st.page === p.id}" :disabled="!gate[p.id].open" :title="gate[p.id].why.join('；')" @click="p.id === 'P2' ? toAnalysis() : go(p.id)">{{ p.name }}</button>
      </nav>
    </div>
  </header>

  <!-- 历史案件 -->
  <template v-if="ui.drawer">
    <div class="drawer-mask" @click="ui.drawer = false"></div>
    <aside class="drawer">
      <h3>历史案件</h3>
      <p class="sub">只保存在这台设备的浏览器里。</p>
      <button class="btn" @click="newCase">新建案件</button>
      <div v-for="c in ui.cases" :key="c.id" class="row" style="align-items:stretch">
        <button class="case-item grow" @click="openCase(c)">
          <b>{{ c.city || (c.facts && c.facts.city) || '未选城市' }}</b> · {{ (c.chat.find(m => m.role === 'user') || {}).text?.slice(0, 18) || '尚未描述' }}<template v-if="c.id === st.id">（当前）</template>
          <div class="sub">{{ c.updated ? c.updated.slice(0, 16).replace('T', ' ') : '' }} · 停在{{ PAGES.find(p => p.id === c.page)?.name }}</div>
        </button>
        <button v-if="ui.delId !== c.id" class="btn plain" aria-label="删除" @click="ui.delId = c.id">删除</button>
        <button v-else class="btn" style="background:var(--danger);border-color:var(--danger)" @click="deleteCase(c.id)">确认删除</button>
      </div>
      <template v-if="ui.cases.length > 1">
        <button v-if="ui.delId !== 'all'" class="btn plain" @click="ui.delId = 'all'">清空全部历史案件</button>
        <button v-else class="btn" style="background:var(--danger);border-color:var(--danger)" @click="deleteCase('all')">确认清空全部（不能恢复）</button>
      </template>
    </aside>
  </template>

  <main class="wrap">
    <!-- 信息链冲突：会影响请求或金额的不一致，由用户选以哪个为准 -->
    <section v-for="(a, i) in st.asks" :key="a.key + i" class="card stack ask">
      <h3>{{ a.label }}对不上，以哪个为准？</h3>
      <div class="row"><button v-for="v in a.values" class="btn ghost" @click="resolveAsk(i, v)">{{ display(a.key, v.v) }}<small class="src">（{{ v.source }}）</small></button></div>
      <p class="sub">两个值都会留档，之后可以在事实摘要里再改。</p>
    </section>
    <!-- P1 事实问答 -->
    <template v-if="st.page === 'P1'">
      <section v-if="st.chat.some(m => m.role === 'user')" class="stack">
        <div class="row"><span class="sub grow">已了解 {{ prog.done }} / {{ prog.total }} 项事实</span><button class="btn plain" @click="toAnalysis">先看分析 →</button></div>
        <div class="progress"><i :style="{width: (prog.done / prog.total * 100) + '%'}"></i></div>
      </section>
      <section class="chat">
        <template v-for="(m, i) in st.chat" :key="i">
          <div class="msg" :class="m.role">{{ m.text }}
            <div v-if="m.usedBy && m.usedBy.length" class="used-by">用于判断：{{ m.usedBy.join('、') }}</div>
            <div v-if="m.role === 'ai' && m.slot && i === st.chat.length - 1 && next && next.key === m.slot" class="opts">
              <template v-if="m.options"><button v-for="o in m.options" :key="o.value" class="chip" @click="pick(m.slot, o)">{{ o.label }}</button></template>
              <input v-else-if="m.type === 'date'" type="date" :id="'d-' + m.slot" @change="e => e.target.value && answer(e.target.value)">
              <button class="chip" @click="notSure(m.slot)">不确定</button>
            </div>
          </div>
          <div v-if="m.summary" class="card stack">
            <h3>事实摘要</h3>
            <p class="sub">点任一项直接修改。改过的会标「已手动修改」，之后补充事实也不会被覆盖。</p>
            <div class="facts">
              <div v-for="r in factRows" :key="r.key" class="fact">
                <span>{{ r.label }} <small class="src">{{ src(r.key) }}</small></span>
                <select v-if="r.type === 'choice'" :id="'f-' + r.key" :value="r.value || ''" @change="e => editFact(r.key, e.target.value)">
                  <option value="">未填</option><option v-for="o in r.options" :value="o.value">{{ o.label }}</option>
                </select>
                <input v-else :id="'f-' + r.key" :list="r.type === 'city' ? 'city-options' : null" :type="r.type === 'number' ? 'number' : r.type === 'date' ? 'date' : 'text'" :value="r.value || ''" @change="e => editFact(r.key, e.target.value)">
              </div>
            </div>
            <button class="btn block" @click="toAnalysis(true)">确认事实，看能主张什么</button>
          </div>
        </template>
        <div v-if="!st.chat.some(m => m.role === 'user')" class="stack">
          <div class="row"><button v-for="k in examples" :key="k" class="chip" @click="useExample(k)">{{ k }}</button><button class="chip" @click="fillSample">填入示例</button></div>
          <p class="disclaimer">AI 生成内容，仅供参考，不构成法律意见。<br><span class="model">模型：{{ model.status }}</span></p>
        </div>
        <div v-if="ui.busy" class="thinking">正在读你说的话…（用 Claude 时约几秒）</div>
        <div id="chat-end"></div>
      </section>
      <div class="composer wrap">
        <div class="inner">
          <textarea id="reply" class="grow" rows="1" style="min-height:44px" v-model="ui.reply" :placeholder="st.chat.some(m => m.role === 'user') ? '直接打字回答，或点上面的选项' : '例如：在苏州做了 3 年仓库主管，月薪 9000，上个月被口头辞退，没签合同'" @keydown.enter.exact.prevent="answer()"></textarea>
          <button id="chat-upload" class="btn ghost" :disabled="ui.busy" title="上传合同、身份证、聊天截图等材料" @click="uploadInChat">＋材料</button>
          <button class="btn" :disabled="ui.busy || !ui.reply.trim()" @click="answer()">发送</button>
        </div>
      </div>
    </template>

    <!-- P2 法律分析与诉求选择 -->
    <template v-if="st.page === 'P2'">
      <!-- ① 能不能申请：结论放最前，判断由代码给出 -->
      <section class="card stack" id="eligibility">
        <h2>{{ { ok: '可以申请劳动仲裁', risk: '可以申请，但有几点要注意', route: '部分事项不走仲裁' }[eligible.level] }}</h2>
        <div v-for="i in eligible.items" :key="i.label" class="calc-line"><b :class="{ ok: 'ok', risk: 'need', route: 'no', info: 'partial' }[i.status]">{{ { ok: '✓', risk: '!', route: '→', info: '·' }[i.status] }} {{ i.label }}</b><span class="formula">{{ i.note }}</span></div>
        <p class="sub">劳动仲裁不收费，也不是必须先调解，可以直接申请（调解仲裁法第 5、53 条）。</p>
      </section>
      <div v-if="analysis.limitation" :class="analysis.limitation.expired ? 'danger' : 'warn'">
        <template v-if="!analysis.limitation.expired">仲裁时效：距离离职已过 {{ analysis.limitation.days }} 天，一般需在 {{ analysis.limitation.deadline }} 前申请。</template>
        <template v-else>距离离职已过 {{ analysis.limitation.days }} 天，超过了一年的仲裁时效。仍可以申请，但公司可能提出时效抗辩；如果向公司讨要过、向有关部门求助过，这些记录能中断时效，请保留。</template>
      </div>
      <section v-for="r in analysis.routes" :key="r.id" class="card stack route">
        <h3>{{ r.title }}：需要单独处理 <span class="pending">{{ r.review }}</span></h3>
        <p class="sub">{{ r.why }}</p>
        <p class="sub"><b>建议：</b>{{ r.next }}</p>
      </section>
      <section v-if="analysis.severance && analysis.severance.why" class="card stack">
        <h3>按你说的离职方式：{{ {'2N': '违法解除赔偿金 2N', N: '经济补偿 N', 'N+notice': '经济补偿 N + 代通知金', '0': '一般没有经济补偿'}[analysis.severance.type] || '还要补充事实' }}</h3>
        <p class="sub">{{ analysis.severance.why }}</p>
      </section>
      <section class="card">
        <h2>你可以主张这些</h2>
        <p class="sub">一个案子可以同时主张多项。下面是根据你说的事实对照法条列出的请求，每项单独标把握程度，勾选要主张的，金额在下一步算。</p>
      </section>
      <p v-if="!analysis.claims.length" class="card sub">按目前的事实，还没有首批支持的请求（违法解除、拖欠工资、未签合同二倍工资）成立。可以回去补充事实。</p>
      <article v-for="c in analysis.claims" :key="c.id" class="claim" :class="{on: st.selected.includes(c.id)}">
        <header>
          <input type="checkbox" :id="'c-' + c.id" :checked="st.selected.includes(c.id)" @change="toggleClaim(c.id)">
          <label :for="'c-' + c.id" class="grow"><h3>{{ c.title }}</h3><span class="sub">{{ c.summary }}</span></label>
          <span class="tier" :class="tierClass(c.tier)">{{ c.tier }}</span>
        </header>
        <div class="els">
          <div v-for="e in c.elements" :key="e.key" class="el"><span>{{ e.label }}</span><span :class="statusClass(e.status)">{{ e.status }}</span></div>
        </div>

    <!-- P6 仲裁申请书 -->
    <template v-if="st.page === 'P6'">

          <h3>被申请人（公司）</h3>
          <label class="f">名称（工商登记全称） <small class="src">{{ src('respondent.name') }}</small><input id="r-name" v-model="st.app.respondent.name"></label>
          <p class="sub">要写工商登记的全称，不写老板个人。不确定的话，到「国家企业信用信息公示系统」www.gsxt.gov.cn 搜公司名核对，顺便打印「基础信息」页，提交时要用。</p>
          <label class="f">住所 <small class="src">{{ src('respondent.address') }}</small><input id="r-addr" v-model="st.app.respondent.address"></label>
          <label class="f">法定代表人（负责人）姓名 <small class="src">{{ src('respondent.legal_rep') }}</small><input id="r-rep" v-model="st.app.respondent.legal_rep"></label>

          <label class="f">统一社会信用代码（选填） <small class="src">{{ src('respondent.credit_code') }}</small><input id="r-code" v-model="st.app.respondent.credit_code"></label>
          <label class="f">企业性质（建议填） <small class="src">{{ src('respondent.company_type') }}</small><input id="r-type" v-model="st.app.respondent.company_type" placeholder="营业执照上的「类型」，如：有限责任公司"></label>
          <label class="f">办公地或经营地（建议填）<input id="r-office" v-model="st.app.respondent.office_address" placeholder="实际办公地址，和住所一样可以不填"></label>
          <label class="f">单位联系人（建议填）<input v-model="st.app.respondent.contact" placeholder="如：人事经理姓名"></label>
          <label class="f">联系人部门及职务（建议填）<input v-model="st.app.respondent.contact_title"></label>
          <label class="f">单位联系电话（建议填）<input v-model="st.app.respondent.phone"></label>
          <p v-if="suggestMiss.length" class="sub">「建议填」的几项不填也能导出，仲裁委要求的话现场补上。</p>
          <label class="check"><input id="agent-on" type="checkbox" v-model="st.app.agent.on"> 委托别人代我办（会多生成一份授权委托书）</label>
          <template v-if="st.app.agent.on">
            <label class="f">代理权限<select v-model="st.app.agent.type"><option value="general">一般代理：代为提出仲裁申请、提交证据、申请回避、参加庭审、签署文书和笔录</option><option value="special">特别代理：另可代为承认、放弃、变更仲裁请求，进行和解，提起反申请</option></select></label>
            <label class="f">代理人姓名<input v-model="st.app.agent.name"></label>
            <label class="f">性别<select v-model="st.app.agent.gender"><option value="">请选择</option><option>男</option><option>女</option></select></label>
            <label class="f">年龄<input type="number" v-model="st.app.agent.age"></label>

            <label class="f">经常居住地<input v-model="st.app.agent.residence"></label>
            <label class="f">联系电话<input v-model="st.app.agent.phone"></label>

          </template>
        </template>
        <template v-if="st.app.step === 2">
          <ol class="path"><li v-for="l in requestLines()">{{ l }}</li></ol>
          <p class="sub">由前面勾选的请求和测算金额带入。要调整请回到「分析」或「测算」。拖欠工资的加付赔偿金默认不写入，一般要先经劳动监察责令支付。</p>

          <div class="row"><span class="sub grow">{{ ui.busy ? '正在起草…' : '由 AI 把对话、补充的细节、材料和证据合并总结，不写金额，请逐段核对修改。' }}</span><button class="btn plain" :disabled="ui.busy" @click="draft">重新起草</button></div>

    <!-- P7 提交包：整套材料、份数、签名位置、原件清单 -->

        <h2>提交材料已经备好</h2>

        <div v-for="m in materialList" :key="m.id" class="calc-line">
          <div class="row"><b class="grow">{{ m.name }}</b><span class="amount" style="font-size:15px">交 {{ m.count }} 份{{ m.keep ? '，自留 ' + m.keep : '' }}</span></div>
          <span class="formula">{{ m.prepare }}{{ m.sign ? '；' + m.sign : '' }}</span>
          <span class="formula">{{ m.legal }}</span>
        </div>
        <button id="dl-package" class="btn block" @click="save('劳动仲裁打印包.docx', printPackage())">下载打印包（Word，一个文件按顺序排好）</button>
        <div class="row">
          <button class="btn plain" @click="save('劳动人事争议仲裁申请书.docx', applicationDoc())">只下申请书</button>
          <button class="btn plain" @click="save('证据清单.docx', evidenceDoc())">只下证据清单</button>
          <button class="btn plain" @click="save('送达地址确认书.docx', serviceAddressDoc())">只下送达地址确认书</button>

        </div>

      </section>
      <section class="card stack">
        <h3>开庭时要带的原件</h3>
        <p class="sub">{{ evItems.map(i => i.tag).join('、') || '还没勾选证据' }}。原件自己保管，提交时只交复印件。</p>
      </section>
      <button class="btn block" @click="go('P8')">怎么提交 →</button>
    </template>

    <!-- P8 提交指引 -->
    <template v-if="st.page === 'P8'">
      <div v-if="limitNear" class="danger">时效快到了：先提交保住时效，证据可以之后补。</div>
      <section class="card stack">
        <h2>去哪里交</h2>
        <div v-if="appFormat.triage && !appFormat.triage.districts" class="stack">
          <p class="sub">{{ appFormat.triage.question }}</p>
          <div class="row"><button class="chip" :class="{on: st.facts.city_level === 'yes'}" @click="editFact('city_level', 'yes')">是</button><button class="chip" :class="{on: st.facts.city_level === 'no'}" @click="editFact('city_level', 'no')">不是</button></div>
        </div>
        <label v-if="appFormat.districts && !(appFormat.triage && !appFormat.triage.districts && st.facts.city_level === 'yes')" class="f">你在哪个区上班 <small class="src">{{ src('district') }}</small>
          <select id="district" :value="st.facts.district || ''" @change="e => editFact('district', e.target.value)"><option value="">请选择</option><option v-for="(v, d) in appFormat.districts" :value="d">{{ d }}{{ /[区县市]$/.test(d) ? '' : '区' }}</option></select></label>
        <div v-if="appFormat.triage && appFormat.triage.districts && triageOn" class="stack">
          <p class="sub">{{ appFormat.triage.question }}</p>
          <div class="row"><button class="chip" :class="{on: st.facts.city_level === 'yes'}" @click="editFact('city_level', 'yes')">是</button><button class="chip" :class="{on: st.facts.city_level === 'no'}" @click="editFact('city_level', 'no')">不是</button></div>
        </div>
        <p v-if="appFormat.triage_skip_note && st.facts.district && !triageOn" class="sub">{{ appFormat.triage_skip_note }}</p>
        <p v-if="appFormat.jurisdiction" class="sub">{{ appFormat.jurisdiction }}</p>

        <template v-if="institution">
          <p class="sub">窗口：{{ institution.address }}<template v-if="institution.phone"><br>电话：{{ institution.phone }}</template><template v-if="institution.hours"><br>办公时间（法定工作日）：{{ institution.hours }}</template><template v-if="!institution.phone"><br>电话和办公时间还没核实，请拨打 {{ appFormat.hotline || '12333' }} 查询。</template><template v-else-if="!institution.hours"><br>官方页面没列接待时间，去之前先打电话问。</template></p>

          <p v-if="triageOn && st.facts.city_level === 'yes' && appFormat.triage.yes_note" class="sub">{{ appFormat.triage.yes_note }}</p>
          <p class="sub">来源：{{ institution.source }}，核对日期 {{ institution.checked }}。窗口信息会变动，出发前先打电话确认。</p>
        </template>
        <p class="sub" v-else-if="appFormat.districts && st.facts.district">这个区的窗口信息还没核实，请拨打 {{ appFormat.hotline || '12333' }} 查询。</p>

        <p v-if="appFormat.submit_note" class="sub">{{ appFormat.submit_note }}</p>

      </section>

      <section v-if="appFormat.online && appFormat.online.recommend" class="card stack" id="platform">

        <div v-for="(step, i) in platformSteps" :key="step.title" class="calc-line stack">
          <b>第 {{ i + 1 }} 步　{{ step.title }}</b><span class="formula">{{ step.note }}</span>

        <button id="dl-evidence-zip" class="btn ghost block" @click="saveEvidenceZip">下载证据文件（按清单顺序命名打包）</button>

      </section>
      <section class="card stack">

        <div class="calc-line stack"><b>{{ appFormat.mail_formal ? '邮寄（当地正式路线）' : '邮寄（先打电话确认这个仲裁委接受邮寄）' }}</b><span class="formula">{{ appFormat.mail || '法律只要求书面申请，没有禁止邮寄，接不接受由各仲裁委自己定。寄到哪里，打电话问清楚。' }}</span>
          <div v-if="mailRisky" class="warn">离时效届满不到 30 天，不推荐邮寄：邮寄那天算不算申请日没有明确规定。请本人或委托代理人到窗口提交。</div>
          <span class="formula">① 用 EMS 等能查物流的方式寄，保留寄件凭证和材料清单。② 寄出后打电话确认对方收到没有、受理没有。</span></div>
        <div class="calc-line"><b>线上</b><span class="formula" v-if="appFormat.online && appFormat.online.recommend">见上方「推荐线上提交」。</span><span class="formula" v-else-if="appFormat.online">{{ appFormat.online.name }}：<a :href="appFormat.online.url" target="_blank" rel="noopener">{{ appFormat.online.url }}</a>。按页面提示逐项上传：申请书、证据清单、证据照片、身份证正反面。{{ appFormat.online_note || '' }}</span><span class="formula" v-else-if="appFormat.online_note">{{ appFormat.online_note }}</span><span class="formula" v-else>全国没有统一的线上仲裁入口，当地线上渠道待核。人社部的在线调解平台只办调解，不办仲裁申请。</span></div>
      </section>
      <section class="card stack">

        <button class="btn block" :disabled="!st.submission.submitted" @click="go('P9')">看后面的时间线 →</button>
      </section>
    </template>

    <!-- P9 案件时间线：节点日期由代码算 -->
    <template v-if="st.page === 'P9'">
      <section class="card stack">
        <h2>案件时间线</h2>
        <p class="sub">每收到一份通知，把上面的日期填进来，后面的期限会重新算。工作日只跳过周末，法定节假日调休没算，以通知书为准。</p>
        <div class="params">
          <label class="f">提交日期<input type="date" v-model="st.submission.submitted"></label>
          <label class="f">受理日期（受理通知书上）<input id="t-accepted" type="date" v-model="st.submission.accepted"></label>
          <label class="f">举证期限（受理通知书上）<input type="date" v-model="st.submission.evidenceDeadline"></label>
          <label class="f">开庭日期（开庭通知上）<input id="t-hearing" type="date" v-model="st.submission.hearing"></label>
          <label class="f">收到裁决书的日期<input type="date" v-model="st.submission.awardReceived"></label>
          <label class="check"><input type="checkbox" v-model="st.submission.finalAward"> 裁决书写明是终局裁决</label>
        </div>
      </section>
      <section class="card stack">
        <p v-if="!events.length" class="sub">先填提交日期。</p>
        <ol class="path"><li v-for="e in events" :key="e.key"><b>{{ e.date || '待定' }} · {{ e.title }}</b><small>{{ e.note }}（{{ e.law }}）</small></li></ol>
        <button v-if="events.length" id="dl-ics" class="btn ghost block" @click="saveIcs">下载到手机日历（提前一天提醒）</button>
        <p class="sub">整个仲裁不收费。调解书双方签收即生效；签之前确认金额和付款时间写清楚。</p>
      </section>
      <section class="card stack" id="hearing">
        <h2>开庭准备</h2>
        <p class="sub">按你的案件材料，列出仲裁员最可能问你的问题和回答要点。回答只用你说过、传过的事实，记不清的如实说。</p>
        <template v-if="st.hearing">
          <div v-for="(h, i) in st.hearing.items" :key="i" class="calc-line stack">
            <b>{{ i + 1 }}. {{ h.q }}</b>
            <span v-if="h.why" class="formula">为什么问：{{ h.why }}</span>
            <span v-for="(p, j) in h.points" :key="j" class="formula">· {{ p }}</span>
            <span v-if="h.evidence.length" class="formula">可以出示：{{ h.evidence.join('、') }}</span>
          </div>
          <p v-if="hearingStale" class="sub">案件信息有变化，可以重新生成。</p>
        </template>
        <button v-if="!st.hearing || hearingStale" id="gen-hearing" class="btn ghost" :disabled="ui.hearBusy" @click="genHearing">{{ ui.hearBusy ? '正在准备…' : (st.hearing ? '重新生成' : '生成开庭问答') }}</button>
      </section>
    </template>

    <section v-if="ui.exportText" class="card stack">
      <h3>当前环境不能直接下载，请复制下面的内容</h3>
      <pre class="export">{{ ui.exportText }}</pre>
      <button class="btn plain" @click="ui.exportText = ''">关闭</button>
    </section>
  </main>
  <datalist id="city-options"><option v-for="c in allCities" :value="c.city"></option></datalist>
  <button v-if="!ui.qaOpen" class="btn fab" id="qa-open" @click="ui.qaOpen = true">问一问</button>
  <div v-if="ui.qaOpen" class="drawer-mask" @click="ui.qaOpen = false"></div>
  <section v-if="ui.qaOpen" class="sheet" id="qa">
    <div class="row"><b class="grow">问答助手</b><button class="btn plain" @click="ui.qaOpen = false">关闭</button></div>
    <div class="sheet-body">
      <p v-if="!st.qa.length" class="sub">关于仲裁流程、费用、证据的问题都可以问。我只按审校过的资料和你这个案子的情况回答，不会改你的数据，金额以测算页为准。</p>
      <div v-if="!st.qa.length" class="row"><button v-for="q in QA_CHIPS" :key="q" class="chip" @click="askQA(q)">{{ q }}</button></div>
      <template v-for="(m, i) in st.qa" :key="i">
        <div class="msg user">{{ m.q }}</div>
        <div class="msg ai">{{ m.a || '想一想…' }}<template v-if="m.sources.length"><br><small class="sub">依据：{{ m.sources.join('；') }}{{ m.pending.length ? '（部分待律师确认）' : '' }}</small></template></div>
      </template>
    </div>
    <div class="row"><input id="qa-input" class="grow" v-model="ui.qaInput" placeholder="输入你的问题" @keydown.enter="askQA()"><button class="btn" :disabled="ui.qaBusy || !ui.qaInput.trim()" @click="askQA()">问</button></div>
  </section>
  <div v-if="ui.toast" class="toast">{{ ui.toast }}</div>
</div>
