<title>劳动仲裁助手</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
/* 布局：手机单栏，最宽 560px 居中；顶部步骤条 + 每页一张主卡片，像一份逐步填好的仲裁材料 */
:root {
  --bg: #f3f5f4; --surface: #ffffff; --ink: #18211f; --muted: #5c6b67; --line: #d8e0dd;
  --accent: #1f5f57; --accent-ink: #ffffff; --accent-soft: #e2efec;
  --solid: #1f5f57; --need: #b7791f; --dispute: #8a8f8d; --danger: #b3412e;
  --need-soft: #fbf1df; --danger-soft: #f8e6e2;
  --serif: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --sans: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121816; --surface: #1b2321; --ink: #e6ecea; --muted: #9aaaa5; --line: #2e3a37;
  --accent: #6cbfb2; --accent-ink: #0c1312; --accent-soft: #1f3330;
  --solid: #6cbfb2; --need: #e0a84f; --dispute: #8d9895; --danger: #e48a78;
  --need-soft: #33291a; --danger-soft: #3a2420; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121816; --surface: #1b2321; --ink: #e6ecea; --muted: #9aaaa5; --line: #2e3a37;
  --accent: #6cbfb2; --accent-ink: #0c1312; --accent-soft: #1f3330;
  --solid: #6cbfb2; --need: #e0a84f; --dispute: #8d9895; --danger: #e48a78;
  --need-soft: #33291a; --danger-soft: #3a2420; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
#app { max-width: 560px; margin: 0 auto; padding-bottom: 96px; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 8px; padding-block: 10px; }
.bar h1 { font-family: var(--serif); font-size: 17px; margin: 0; flex: 1; letter-spacing: .02em; }
.icon-btn { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 4px 10px; font-size: 13px; }
.steps { display: flex; gap: 2px; padding-bottom: 8px; overflow-x: auto; }
.steps button { flex: 1 0 auto; border: 0; background: transparent; padding: 4px 6px; font-size: 12px; color: var(--muted); border-bottom: 2px solid transparent; }
.steps button.on { color: var(--accent); border-color: var(--accent); font-weight: 600; }
.steps button:disabled { opacity: .45; cursor: default; }

main { display: grid; gap: 14px; padding-block: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
h2 { font-family: var(--serif); font-size: 20px; margin: 0 0 4px; text-wrap: balance; }
h3 { font-size: 15px; margin: 0; }
.sub { color: var(--muted); font-size: 13px; margin: 0; }
.eyebrow { font-size: 11px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.stack { display: grid; gap: 10px; }

.btn { border: 0; border-radius: 10px; padding: 10px 16px; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.btn.plain { background: transparent; color: var(--muted); padding: 6px 8px; font-weight: 400; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.block { width: 100%; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

textarea, input[type=text], input[type=number], input[type=date], input:not([type]), select {
  width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); }
textarea { min-height: 120px; resize: vertical; }
label.f { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }

.city { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 10px; background: transparent; width: 100%; text-align: left; }
.city b { color: var(--ink); }
.city-list { max-height: 240px; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 6px; padding-top: 8px; }
.disclaimer { font-size: 12px; color: var(--muted); text-align: center; }

/* 对话 */
.chat { display: grid; gap: 10px; }
.msg { max-width: 88%; padding: 10px 12px; border-radius: 12px; white-space: pre-wrap; }
.msg.ai { background: var(--surface); border: 1px solid var(--line); justify-self: start; border-top-left-radius: 4px; }
.msg.user { background: var(--accent); color: var(--accent-ink); justify-self: end; border-top-right-radius: 4px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.composer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 4; }
.composer .inner { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; }
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); }
.thinking { color: var(--muted); font-size: 13px; }

/* 事实表 */
.facts { display: grid; gap: 8px; }
.fact { display: grid; grid-template-columns: 7.5em 1fr; gap: 8px; align-items: center; font-size: 14px; }
.fact span { color: var(--muted); }
.fact .empty { color: var(--need); }

/* 请求卡片 */
.claim { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; background: var(--surface); }
.claim.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.claim header { display: flex; gap: 10px; align-items: flex-start; }
.claim input[type=checkbox] { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); flex: none; }
.tier { font-size: 12px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; border: 1px solid currentColor; }
.tier.solid { color: var(--solid); } .tier.need { color: var(--need); } .tier.dispute { color: var(--dispute); }
.els { display: grid; gap: 4px; font-size: 13px; }
.el { display: flex; justify-content: space-between; gap: 8px; }
.el .ok { color: var(--solid); } .el .need, .el .partial { color: var(--need); } .el .no { color: var(--danger); }
details { font-size: 13px; }
details summary { cursor: pointer; color: var(--accent); }
.law { padding: 6px 0; border-top: 1px dashed var(--line); }
.pending { font-size: 11px; color: var(--need); border: 1px solid var(--need); border-radius: 4px; padding: 0 4px; margin-left: 4px; white-space: nowrap; }
.amount { font-variant-numeric: tabular-nums; font-weight: 700; }
.warn { background: var(--need-soft); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.danger { background: var(--danger-soft); color: var(--danger); border-radius: 10px; padding: 10px 12px; font-size: 13px; }

/* 测算 */
.calc-line { display: grid; gap: 4px; padding: 10px 0; border-top: 1px solid var(--line); }
.calc-line:first-child { border-top: 0; }
.formula { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.params { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.manual { font-size: 11px; color: var(--accent); }

/* 报告 */
.big { font-family: var(--serif); font-size: 34px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.tri { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line); }
.tri i:nth-child(1) { background: var(--solid); } .tri i:nth-child(2) { background: var(--need); } .tri i:nth-child(3) { background: var(--dispute); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.legend b::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; background: currentColor; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; background: transparent; padding: 8px 4px; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button.on { color: var(--accent); border-color: var(--accent); font-weight: 600; }
ol.path { margin: 0; padding-left: 20px; display: grid; gap: 10px; }
ol.path small { color: var(--muted); display: block; }

/* 证据 */
.ev-group { display: grid; gap: 8px; }
.drawer-mask { position: fixed; inset: 0; background: rgb(0 0 0 / .35); z-index: 20; }
.drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(320px, 85vw); background: var(--surface); z-index: 21; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 16px max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; display: grid; align-content: start; gap: 8px; }
.case-item { text-align: left; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: transparent; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 30; }
pre.export { white-space: pre-wrap; font-size: 12px; background: var(--bg); padding: 10px; border-radius: 8px; max-height: 260px; overflow: auto; }
.model { font-size: 11px; color: var(--muted); }
.used-by { font-size: 11px; color: var(--muted); margin-top: 6px; }
.route { border-color: var(--need); background: var(--need-soft); }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>

<div id="app">
  <header class="top">
    <div class="wrap">
      <div class="bar">
        <button class="icon-btn" @click="ui.drawer = true" aria-label="历史案件">☰</button>
        <h1>劳动仲裁助手 <span class="pending">测试版</span></h1>
        <button v-if="st.page !== 'P1'" class="icon-btn" @click="go('P1')">补充事实</button>
      </div>
      <nav class="steps" v-if="st.chat.some(m => m.role === 'user')">
        <button v-for="p in PAGES" :key="p.id" :class="{on: st.page === p.id}" :disabled="p.id !== 'P1' && p.id !== 'P2' && !st.selected.length" @click="p.id === 'P2' ? toAnalysis() : go(p.id)">{{ p.name }}</button>
      </nav>
    </div>
  </header>

  <!-- 历史案件 -->
  <template v-if="ui.drawer">
    <div class="drawer-mask" @click="ui.drawer = false"></div>
    <aside class="drawer">
      <h3>历史案件</h3>
      <p class="sub">只保存在这台设备的浏览器里。</p>
      <button class="btn" @click="newCase">新建案件</button>
      <button v-for="c in ui.cases" :key="c.id" class="case-item" @click="openCase(c)">
        <b>{{ c.city || '未选城市' }}</b> · {{ (c.chat.find(m => m.role === 'user') || {}).text?.slice(0, 18) || '尚未描述' }}
        <div class="sub">{{ c.updated ? c.updated.slice(0, 16).replace('T', ' ') : '' }} · 停在{{ PAGES.find(p => p.id === c.page)?.name }}</div>
      </button>
    </aside>
  </template>

  <main class="wrap">
    <!-- P1 事实问答 -->
    <template v-if="st.page === 'P1'">
      <section v-if="st.chat.some(m => m.role === 'user')" class="stack">
        <div class="row"><span class="sub grow">已了解 {{ prog.done }} / {{ prog.total }} 项事实</span><button class="btn plain" @click="toAnalysis">先看分析 →</button></div>
        <div class="progress"><i :style="{width: (prog.done / prog.total * 100) + '%'}"></i></div>
      </section>
      <section class="chat">
        <template v-for="(m, i) in st.chat" :key="i">
          <div class="msg" :class="m.role">{{ m.text }}
            <div v-if="m.usedBy && m.usedBy.length" class="used-by">用于判断：{{ m.usedBy.join('、') }}</div>
            <div v-if="m.role === 'ai' && m.slot && i === st.chat.length - 1 && next && next.key === m.slot" class="opts">
              <template v-if="m.options"><button v-for="o in m.options" :key="o.value" class="chip" @click="pick(m.slot, o)">{{ o.label }}</button></template>
              <input v-else-if="m.type === 'date'" type="date" :id="'d-' + m.slot" @change="e => e.target.value && answer(e.target.value)">
              <button class="chip" @click="notSure(m.slot)">不确定</button>
            </div>
          </div>
          <div v-if="m.summary" class="card stack">
            <h3>事实摘要</h3>
            <p class="sub">点任一项直接修改。改过的会标「已手动修改」，之后补充事实也不会被覆盖。</p>
            <div class="facts">
              <div v-for="r in factRows" :key="r.key" class="fact">
                <span>{{ r.label }}</span>
                <select v-if="r.type === 'choice'" :id="'f-' + r.key" :value="r.value || ''" @change="e => editFact(r.key, e.target.value)">
                  <option value="">未填</option><option v-for="o in r.options" :value="o.value">{{ o.label }}</option>
                </select>
                <input v-else :id="'f-' + r.key" :list="r.type === 'city' ? 'city-options' : null" :type="r.type === 'number' ? 'number' : r.type === 'date' ? 'date' : 'text'" :value="r.value || ''" @change="e => editFact(r.key, e.target.value)">
              </div>
            </div>
            <button class="btn block" @click="toAnalysis">确认事实，看能主张什么</button>
          </div>
        </template>
        <div v-if="!st.chat.some(m => m.role === 'user')" class="stack">
          <div class="row"><button v-for="k in examples" :key="k" class="chip" @click="useExample(k)">{{ k }}</button><button class="chip" @click="fillSample">填入示例</button></div>
          <p class="disclaimer">AI 生成内容，仅供参考，不构成法律意见。<br><span class="model">模型：{{ model.status }}</span></p>
        </div>
        <div v-if="ui.busy" class="thinking">正在读你说的话…（用 Claude 时约几秒）</div>
        <div id="chat-end"></div>
      </section>
      <div class="composer wrap">
        <div class="inner">
          <textarea id="reply" class="grow" rows="1" style="min-height:44px" v-model="ui.reply" :placeholder="st.chat.some(m => m.role === 'user') ? '直接打字回答，或点上面的选项' : '例如：在苏州做了 3 年仓库主管，月薪 9000，上个月被口头辞退，没签合同'" @keydown.enter.exact.prevent="answer()"></textarea>
          <button class="btn" :disabled="ui.busy || !ui.reply.trim()" @click="answer()">发送</button>
        </div>
      </div>
    </template>

    <!-- P2 法律分析与诉求选择 -->
    <template v-if="st.page === 'P2'">
      <div v-if="analysis.limitation" :class="analysis.limitation.expired ? 'danger' : 'warn'">
        <template v-if="!analysis.limitation.expired">仲裁时效：距离离职已过 {{ analysis.limitation.days }} 天，一般需在 {{ analysis.limitation.deadline }} 前申请。</template>
        <template v-else>距离离职已过 {{ analysis.limitation.days }} 天，超过了一年的仲裁时效。仍可以申请，但公司可能提出时效抗辩；如果向公司讨要过、向有关部门求助过，这些记录能中断时效，请保留。</template>
      </div>
      <section v-for="r in analysis.routes" :key="r.id" class="card stack route">
        <h3>{{ r.title }}：需要单独处理 <span class="pending">{{ r.review }}</span></h3>
        <p class="sub">{{ r.why }}</p>
        <p class="sub"><b>建议：</b>{{ r.next }}</p>
      </section>
      <section class="card">
        <h2>你可以主张这些</h2>
        <p class="sub">一个案子可以同时主张多项。下面是根据你说的事实对照法条列出的请求，每项单独标把握程度，勾选要主张的，金额在下一步算。</p>
      </section>
      <p v-if="!analysis.claims.length" class="card sub">按目前的事实，还没有首批支持的请求（违法解除、拖欠工资、未签合同二倍工资）成立。可以回去补充事实。</p>
      <article v-for="c in analysis.claims" :key="c.id" class="claim" :class="{on: st.selected.includes(c.id)}">
        <header>
          <input type="checkbox" :id="'c-' + c.id" :checked="st.selected.includes(c.id)" @change="toggleClaim(c.id)">
          <label :for="'c-' + c.id" class="grow"><h3>{{ c.title }}</h3><span class="sub">{{ c.summary }}</span></label>
          <span class="tier" :class="tierClass(c.tier)">{{ c.tier }}</span>
        </header>
        <div class="els">
          <div v-for="e in c.elements" :key="e.key" class="el"><span>{{ e.label }}</span><span :class="statusClass(e.status)">{{ e.status }}</span></div>
        </div>
        <div v-if="c.calc" class="row"><span class="sub grow">估算可主张</span><span class="amount">{{ c.calc.amount != null ? E.yuan(c.calc.amount) + ' 元' : '缺' + c.calc.lack.join('、') }}</span></div>
        <div v-for="d in c.disputes" class="warn">争议点：{{ d }}</div>
        <details>
          <summary>依据的法条（{{ c.laws.length }} 条）</summary>
          <div v-for="l in c.laws" class="law"><b>{{ l.name }}</b><span class="pending">{{ l.review }}</span><div class="sub">{{ l.gist }}</div></div>
          <p class="sub">规则编号 {{ c.ref.join('、') }}。条号已按校准文档核对，原文入库前还要对国家法律法规数据库复核。</p>
        </details>
      </article>
      <div v-for="p in conflicts" class="danger">「{{ p[0] }}」和「{{ p[1] }}」只能二选一，请取消其中一项。</div>
      <section v-if="analysis.unsupported.length" class="card stack">
        <h3>还识别到这些问题</h3>
        <div v-for="u in analysis.unsupported" class="el"><span>{{ u.title }}</span><span class="sub">{{ u.note }}</span></div>
      </section>
      <button class="btn block" :disabled="!st.selected.length || conflicts.length" @click="go('P3')">算一算金额</button>
    </template>

    <!-- P3 金额测算 -->
    <template v-if="st.page === 'P3'">
      <section class="card stack">
        <h2>金额测算</h2>
        <p class="sub">金额全部按固定公式计算，改任何参数都会马上重算。这里的数是「可主张」的数额，不等于最终能拿到的。</p>
        <div class="params">
          <label class="f">城市<input id="p-city" :value="st.facts.city" disabled></label>
          <label v-for="k in ['monthly_wage', 'start_date', 'end_date', 'contract_signed_date', 'wages_owed_amount'].filter(k => !F.SLOTS[k].when || F.SLOTS[k].when(st.facts))" :key="k" class="f">
            <span>{{ F.SLOTS[k].label }} <span v-if="st.manual[k]" class="manual">已手动修改</span></span>
            <input :id="'p-' + k" :type="F.SLOTS[k].type === 'number' ? 'number' : 'date'" :value="st.facts[k] || ''" @change="e => editFact(k, e.target.value)">
          </label>
          <label class="f"><span>{{ F.PARAM_SLOTS.monthly_overtime.label }} <span v-if="st.manual.monthly_overtime" class="manual">已手动修改</span></span>
            <input id="p-ot" type="number" :value="st.facts.monthly_overtime || ''" @change="e => editFact('monthly_overtime', e.target.value)" placeholder="填了会多算一个不含加班费的保守值"></label>
          <label class="f"><span>{{ F.PARAM_SLOTS.filing_date.label }}</span>
            <input id="p-filing" type="date" :value="st.facts.filing_date || today()" @change="e => editFact('filing_date', e.target.value)"></label>
          <label class="f"><span>{{ st.facts.city }} {{ std && std.year }} 年度职工月平均工资 <span class="sub">（{{ stdOrigin('avg_wage') }}）</span></span>
            <input id="p-avg" type="number" v-model="st.avgWage" placeholder="该地标准待补，可自行填写"></label>
          <label class="f"><span>{{ st.facts.city }} 月最低工资 <span class="sub">（{{ stdOrigin('min_wage') }}）</span></span>
            <input id="p-min" type="number" v-model="st.minWage" placeholder="该地标准待补，可自行填写"></label>
          <label class="f row" style="grid-column:1/-1"><input id="p-agreed" type="checkbox" :checked="!!st.facts.agreed_registered_std" @change="e => { st.facts.agreed_registered_std = e.target.checked }"> 合同约定按公司注册地标准执行</label>
          <template v-if="st.facts.agreed_registered_std">
            <label class="f"><span>{{ F.PARAM_SLOTS.company_city.label }}</span>
              <input id="p-ccity" list="city-options" :value="st.facts.company_city || ''" @change="e => editFact('company_city', e.target.value)"></label>
            <label class="f"><span>注册地职工月平均工资</span>
              <input id="p-ravg" type="number" v-model="st.regAvgWage" placeholder="该地标准待补，可自行填写"></label>
          </template>
          <p class="sub" style="grid-column:1/-1">社平工资和最低工资按工作地取；只有注册地标准更高、且合同约定按注册地执行时，才取注册地。当前取：{{ stdCity }}。</p>
        </div>
      </section>
      <section class="card">
        <div v-for="c in chosen" :key="c.id" class="calc-line">
          <div class="row"><b class="grow">{{ c.title }}</b><span class="amount">{{ c.calc ? (c.calc.amount != null ? E.yuan(c.calc.amount) + ' 元' : '—') : '不涉及金额' }}</span></div>
          <div v-if="c.calc && c.calc.formula" class="formula">{{ c.calc.formula }}</div>
          <div v-if="c.calc && c.calc.lack" class="formula">还缺：{{ c.calc.lack.join('、') }}</div>
          <div v-if="c.calc && c.calc.conservative != null" class="formula">保守值：{{ E.yuan(c.calc.conservative) }} 元（{{ c.calc.conservativeNote }}）</div>
          <div v-for="n in (c.calc && c.calc.notes) || []" class="formula">注：{{ n }}</div>
        </div>
        <div class="calc-line"><div class="row"><b class="grow">合计（主张值）</b><span class="amount">{{ E.yuan(totals.total) }} 元</span></div>
          <div v-if="totals.conservative !== totals.total" class="row"><span class="grow sub">保守值合计</span><span class="amount">{{ E.yuan(totals.conservative) }} 元</span></div></div>
        <p class="sub">申请时可以按主张值提；保守值是按更不利的口径算的，差别来自上面标出的参数。</p>
      </section>
      <button class="btn block" @click="go('P4')">生成可行性报告</button>
    </template>

    <!-- P4 可行性报告 -->
    <template v-if="st.page === 'P4'">
      <section class="card stack">
        <span class="eyebrow">预计可主张总额 · {{ st.facts.city }}</span>
        <div class="big">{{ E.yuan(totals.total) }} <small style="font-size:16px">元</small></div>
        <div class="tri"><i :style="{width: pct('基本稳')}"></i><i :style="{width: pct('需补证')}"></i><i :style="{width: pct('有争议')}"></i></div>
        <div class="legend"><b style="color:var(--solid)">基本稳 {{ E.yuan(totals['基本稳']) }}</b><b style="color:var(--need)">需补证 {{ E.yuan(totals['需补证']) }}</b><b style="color:var(--dispute)">有争议 {{ E.yuan(totals['有争议']) }}</b></div>
        <p v-if="totals.conservative !== totals.total" class="sub">按更不利的口径算，保守值为 {{ E.yuan(totals.conservative) }} 元。</p>
        <p class="sub">生成于 {{ today() }}；社平工资取 {{ stdCity }} {{ std && std.year }} 年度（{{ std && std.origin.avg_wage }}）。</p>
      </section>
      <section class="card stack">
        <div class="tabs">
          <button :class="{on: ui.tab === 'detail'}" @click="ui.tab = 'detail'">请求明细</button>
          <button :class="{on: ui.tab === 'path'}" @click="ui.tab = 'path'">维权路径</button>
          <button :class="{on: ui.tab === 'defense'}" @click="ui.tab = 'defense'">对方会怎么说</button>
        </div>
        <template v-if="ui.tab === 'detail'">
          <div v-for="c in chosen" :key="c.id" class="calc-line">
            <div class="row"><b class="grow">{{ c.title }}</b><span class="tier" :class="tierClass(c.tier)">{{ c.tier }}</span></div>
            <div class="formula">{{ c.calc && c.calc.formula || '不涉及金额' }}</div>
            <div v-if="c.toSolid.length && c.tier !== '基本稳'" class="formula">要变成基本稳还差：{{ c.toSolid.join('；') }}</div>
            <div v-for="d in c.disputes" class="formula">争议点：{{ d }}</div>
          </div>
          <details><summary>三档是什么意思</summary>
            <p>基本稳：事实清楚，有直接证据，按法定标准可算。<br>需补证：主张成立，但还缺关键证据，补上就能转为基本稳。<br>有争议：法律上有不同观点，或前提可能被对方推翻。</p>
            <p class="sub">分档条件按校准文档 5.3 节。</p></details>
        </template>
        <template v-if="ui.tab === 'path'">
          <ol class="path"><li v-for="s in R.PATH"><b>{{ s.step }}</b><small>{{ s.time }} · {{ s.note }}</small></li></ol>
          <p class="sub">建议申请的仲裁委：{{ arbitration }}（劳动合同履行地；也可以去公司所在地）。劳动仲裁不收费。</p>
        </template>
        <template v-if="ui.tab === 'defense'">
          <div v-for="c in chosen" :key="c.id" class="stack">
            <h3>{{ c.title }}</h3>
            <div v-for="d in c.defenses" class="calc-line"><b>对方可能说：「{{ d.says }}」</b><span class="formula">你可以准备：{{ d.prepare }}</span></div>
          </div>
        </template>
      </section>
      <button class="btn block" @click="go('P5')">整理证据</button>
    </template>

    <!-- P5 证据清单 -->
    <template v-if="st.page === 'P5'">
      <section class="card">
        <h2>证据清单</h2>
        <p class="sub">只列和你选的请求有关的证据。点一下就勾上，并可以上传照片：{{ imgCaps.ok ? '我会读出上面的信息，自动记下，写申请书时不用再填。' : '当前环境不能识别图片，照片只做附件。' }}勾选会更新报告里的分档。</p>
      </section>
      <section v-if="st.recognized.length" class="card stack">
        <h3>从你的材料里读到</h3>
        <div v-for="(r, i) in st.recognized" :key="i" class="calc-line">
          <b>{{ r.tag }}</b>
          <span v-if="r.busy" class="formula">正在识别…你可以继续勾选其他材料</span>
          <span v-if="r.filled.length" class="formula">已记下：{{ r.filled.join('、') }}</span>
          <span v-for="c in r.conflicts" class="formula" style="color:var(--need)">{{ c }}</span>
          <span v-if="r.note" class="formula">{{ r.note }}</span>
        </div>
        <p class="sub">读到的信息已写进事实摘要和申请书，可以随时修改。</p>
      </section>
      <section v-for="g in evidenceGroups" :key="g.group" class="card ev-group">
        <h3>{{ g.title }}</h3>
        <p class="sub">{{ g.purpose }}</p>
        <div class="row"><button v-for="o in g.options" :key="o" class="chip" :class="{on: st.evidence[g.group].includes(o)}" @click="toggleEvidence(g.group, o)">{{ o }}<template v-if="files[g.group + '|' + o]"> · {{ files[g.group + '|' + o].length }} 个文件</template></button></div>
        <div class="row"><button v-for="o in st.evidence[g.group]" :key="'u' + o" class="btn plain" @click="upload(kindOfTag(o), o, g.group + '|' + o)">＋ 给「{{ o }}」再传一张</button></div>
      </section>
      <section class="card stack">
        <div v-for="c in chosen" :key="c.id" class="el"><span>{{ c.title }}</span><span class="tier" :class="tierClass(c.tier)">{{ c.tier }}</span></div>
        <p class="sub">申请时一般交复印件，开庭带原件。{{ R.EVIDENCE_TIP }}</p>
        <button class="btn ghost block" @click="save('证据目录.docx', evidenceDoc())">导出证据目录（Word）</button>
      </section>
      <button class="btn block" @click="go('P6')">写仲裁申请书</button>
    </template>

    <!-- P6 仲裁申请书 -->
    <template v-if="st.page === 'P6'">
      <section class="card stack">
        <span class="eyebrow">第 {{ st.app.step }} 步 / 共 3 步</span>
        <h2>{{ ['当事人信息', '仲裁请求', '事实与理由'][st.app.step - 1] }}</h2>
        <template v-if="st.app.step === 1">
          <div class="row">
            <button class="btn ghost" @click="upload('id_card', '身份证')">拍身份证自动填</button>
            <button class="btn ghost" @click="upload('license', '营业执照')">传营业执照或合同，填公司信息</button>
          </div>
          <p class="sub" v-if="st.recognized.length">已从你上传的材料里自动填写，请核对。{{ st.recognized.some(r => r.busy) ? '还有材料在识别中…' : '' }}</p>
          <h3>申请人（你）</h3>
          <label class="f">姓名<input id="a-name" v-model="st.app.applicant.name"></label>
          <label class="f">性别<select id="a-gender" v-model="st.app.applicant.gender"><option value="">请选择</option><option>男</option><option>女</option></select></label>
          <label class="f">身份证号<input id="a-id" v-model="st.app.applicant.id_no"></label>
          <label class="f">住址<input id="a-addr" v-model="st.app.applicant.address"></label>
          <label class="f">电话<input id="a-phone" v-model="st.app.applicant.phone"></label>
          <h3>被申请人（公司）</h3>
          <label class="f">名称<input id="r-name" v-model="st.app.respondent.name"></label>
          <label class="f">住所<input id="r-addr" v-model="st.app.respondent.address"></label>
          <label class="f">法定代表人（选填）<input id="r-rep" v-model="st.app.respondent.legal_rep"></label>
          <label class="f">统一社会信用代码（选填）<input id="r-code" v-model="st.app.respondent.credit_code"></label>
        </template>
        <template v-if="st.app.step === 2">
          <ol class="path"><li v-for="l in requestLines()">{{ l }}</li></ol>
          <p class="sub">由前面勾选的请求和测算金额带入。要调整请回到「分析」或「测算」。拖欠工资的加付赔偿金默认不写入，一般要先经劳动监察责令支付。</p>
        </template>
        <template v-if="st.app.step === 3">
          <textarea id="reasons" v-model="st.app.reasons" style="min-height:220px"></textarea>
          <div class="row"><span class="sub grow">{{ ui.busy ? '正在起草…' : '根据事实摘要起草，请逐段核对修改。' }}</span><button class="btn plain" :disabled="ui.busy" @click="draft">重新起草</button></div>
        </template>
        <div v-if="ui.missing.length" class="danger">请补充：{{ ui.missing.join('、') }}</div>
        <div class="row">
          <button v-if="st.app.step > 1" class="btn ghost" @click="st.app.step--; ui.missing = []">上一步</button>
          <button v-if="st.app.step < 3" class="btn grow" @click="appNext">下一步</button>
          <button v-else class="btn grow" @click="exportApp">导出申请书（Word）</button>
        </div>
      </section>
      <section v-if="st.app.step === 3" class="card stack">
        <h3>提交指引</h3>
        <p class="sub">交到：{{ arbitration }}。一般需要申请书一式若干份（按被申请人人数加一）、身份证复印件、证据材料复印件。证据要写明来源，有证人的写明姓名和住所。各地仲裁委的格式和是否支持线上立案不同，请以当地为准。</p>
      </section>
    </template>

    <section v-if="ui.exportText" class="card stack">
      <h3>当前环境不能直接下载，请复制下面的内容</h3>
      <pre class="export">{{ ui.exportText }}</pre>
      <button class="btn plain" @click="ui.exportText = ''">关闭</button>
    </section>
  </main>
  <datalist id="city-options"><option v-for="c in allCities" :value="c.city"></option></datalist>
  <div v-if="ui.toast" class="toast">{{ ui.toast }}</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="rules/regions.js"></script>
<script src="rules/rules.js"></script>
<script src="engine/facts.js"></script>
<script src="engine/engine.js"></script>
<script src="engine/docs.js"></script>
<script src="web/app.js"></script>
